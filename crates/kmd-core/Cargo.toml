[package]
name = "kmd-core"
version = "0.15.2"
edition = "2021"
description = "keymander core library — indexing, search, config, database"

[dependencies]
# Search
nucleo = "0.5"
regex = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# 본문 인덱싱 — Windows 한국어 legacy 텍스트(EUC-KR/CP949) 디코드 폴백 (docs/15)
encoding_rs = "0.8"

# Config / Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Paths
dirs = "6"

# Error
thiserror = "2"

# Logging
tracing = "0.1"

# File walking
walkdir = "2"

# IPC auth token RNG
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
