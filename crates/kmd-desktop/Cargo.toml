[package]
name = "kmd-desktop"
version = "0.2.0"
edition = "2021"
description = "keymander Desktop — GPU-accelerated launcher with iced"
license = "MIT"
default-run = "kmd-desktop"

[[bin]]
name = "kmd-desktop"
path = "src/main.rs"

[dependencies]
kmd-core = { path = "../kmd-core" }

# GUI
iced = { version = "0.14", features = ["tokio"] }

# Error handling
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
