[package]
name = "kmd-daemon"
version = "0.13.0"
edition = "2021"
description = "keymander Daemon — background service with IPC, global hotkey, key bindings"

[[bin]]
name = "kmd-daemon"
path = "src/main.rs"

[dependencies]
kmd-core = { path = "../kmd-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
color-eyre = "0.6"

# 클립보드 — 히스토리 감시/붙여넣기(docs/12, 크로스플랫폼) + LLM 오토파일럿 주입
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
# NSPasteboard 직접 접근 — changeCount 기반 감시 + Concealed 마크(비밀번호) 제외
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # 훅 워치독의 GetTickCount (훅 생존 하트비트)
    "Win32_System_SystemInformation",
] }
