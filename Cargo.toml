[workspace]
members = ["crates/kmd-core", "crates/kmd-desktop"]
exclude = ["tools/gen-icon"]
resolver = "2"

[package]
name = "keymander"
version = "0.2.3"
edition = "2021"
build = "build.rs"
description = "키보드 하나로 모든 것을 지휘한다 — CLI-first 크로스플랫폼 런처"
license = "MIT"
repository = "https://github.com/bullpae/keymander-cli"
keywords = ["cli", "launcher", "tui", "terminal", "productivity"]
categories = ["command-line-utilities"]
default-run = "kmd"

[[bin]]
name = "kmd"
path = "src/main.rs"

[dependencies]
kmd-core = { path = "crates/kmd-core" }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Error
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for CLI JSON output)
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Unicode display width (for proper CJK cursor positioning)
unicode-width = "0.2"
arboard = "3.6.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
OriginalFilename = "kmd.exe"
FileDescription = "keymander - keyboard-driven launcher"
ProductName = "keymander"

[profile.release]
opt-level = 2
lto = true
strip = true
codegen-units = 1
panic = "abort"

# CLI binary: size-optimized (less impactful since it's TUI)
[profile.release.package.keymander]
opt-level = "z"
