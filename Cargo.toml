[workspace]
members = ["crates/kmd-core", "crates/kmd-desktop", "crates/kmd-daemon"]
exclude = ["tools/gen-icon"]
resolver = "2"

[package]
name = "keymander"
version = "0.10.2"
edition = "2021"
build = "build.rs"
description = "?ㅻ낫???섎굹濡?紐⑤뱺 寃껋쓣 吏?섑븳????CLI-first ?щ줈?ㅽ뵆?ロ뤌 ?곗쿂"
license = "MIT"
repository = "https://github.com/bullpae/keymander-cli"
keywords = ["cli", "launcher", "tui", "terminal", "productivity"]
categories = ["command-line-utilities"]
default-run = "kmd"

[[bin]]
name = "kmd"
path = "src/main.rs"

[dependencies]
kmd-core = { path = "crates/kmd-core" }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Error
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for CLI JSON output)
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Unicode display width (for proper CJK cursor positioning)
unicode-width = "0.2"
arboard = "3.6.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
OriginalFilename = "kmd.exe"
FileDescription = "keymander - keyboard-driven launcher"
ProductName = "keymander"

# .deb ?⑦궎吏?(cargo-deb) ??由대━???뚰겕?뚮줈?곗쓽 build-packages ?≪씠 ?ъ슜.
# 諛붿씠?덈━ 3媛쒕? ?④퍡 ?댁쑝誘濡?--no-build濡??몄텧?쒕떎 (?ъ쟾 鍮뚮뱶 ?꾩닔).
[package.metadata.deb]
name = "keymander"
maintainer = "bullpae <bullpae@gmail.com>"
copyright = "2026, bullpae"
section = "utils"
priority = "optional"
extended-description = """\
Keyboard-driven cross-platform launcher: kmd (TUI/CLI), \
kmd-desktop (GUI launcher), and kmd-daemon (key-remap daemon)."""
assets = [
    ["target/release/kmd", "usr/bin/", "755"],
    ["target/release/kmd-desktop", "usr/bin/", "755"],
    ["target/release/kmd-daemon", "usr/bin/", "755"],
    ["target/package/config.example.toml", "usr/share/keymander/config.example.toml", "644"],
    ["README.md", "usr/share/doc/keymander/README.md", "644"],
]

# .rpm ?⑦궎吏?(cargo-generate-rpm) ???숈씪?섍쾶 ?ъ쟾 鍮뚮뱶 ???몄텧.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/kmd", dest = "/usr/bin/kmd", mode = "755" },
    { source = "target/release/kmd-desktop", dest = "/usr/bin/kmd-desktop", mode = "755" },
    { source = "target/release/kmd-daemon", dest = "/usr/bin/kmd-daemon", mode = "755" },
    { source = "target/package/config.example.toml", dest = "/usr/share/keymander/config.example.toml", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/keymander/README.md", mode = "644" },
]

[profile.release]
opt-level = 2
lto = true
strip = true
codegen-units = 1
panic = "abort"

# CLI binary: size-optimized (less impactful since it's TUI)
[profile.release.package.keymander]
opt-level = "z"
