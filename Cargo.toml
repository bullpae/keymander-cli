[workspace]
members = ["crates/kmd-core"]
resolver = "2"

[package]
name = "keymander"
version = "0.2.0-alpha.1"
edition = "2021"
description = "키보드 하나로 모든 것을 지휘한다 — CLI-first 크로스플랫폼 런처"
license = "MIT"
repository = "https://github.com/bullpae/keymander"
keywords = ["cli", "launcher", "tui", "terminal", "productivity"]
categories = ["command-line-utilities"]
default-run = "kmd"

[[bin]]
name = "kmd"
path = "src/main.rs"

[dependencies]
kmd-core = { path = "crates/kmd-core" }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error
color-eyre = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for CLI JSON output)
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Unicode display width (for proper CJK cursor positioning)
unicode-width = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
