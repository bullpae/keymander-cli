# ============================================================
# keymander (kmd) — 포터블 기본 설정
# ============================================================
#
# 이 파일은 kmd-data/ 안에 위치하며, 포터블 모드에서 자동으로 읽힙니다.
# 모든 설정은 선택사항이며, 생략하면 기본값이 적용됩니다.
#
# 설정 변경 방법:
#   - 이 파일을 직접 편집
#   - kmd-desktop 에서 :set 또는 :settings 입력
#   - kmd (TUI) 에서 F2 키
#   - CLI: kmd config set general.theme "nord"

# ── 일반 설정 ────────────────────────────────────────────────
[general]
# TUI 렌더링 FPS (기본: 30)
# render_fps = 30

# 미리보기 패널 표시 여부
# show_preview = true
# preview_width_percent = 40

# 테마: default | midnight | obsidian | snow | rose_pine | nord
# theme = "default"

# 이모지 아이콘 사용 (false = ASCII 2자 아이콘으로 대체)
# Windows 10 레거시 콘솔에서는 자동으로 false 적용
# emoji_icons = true

# Desktop 실행 시 IME를 영어 모드로 전환
# reset_ime_on_launch = true

# ── 런처 설정 ────────────────────────────────────────────────
[launcher]
# 파일 검색 엔진: auto | builtin | fd | everything | mdfind | locate | winfs
# file_search_provider = "auto"

# 최대 인덱스 항목 수 (기본: 5000)
# max_results = 5000

# 파일 탐색 최대 깊이 (기본: 4)
# search_depth = 4

# 실행 후 창 닫기
# quit_on_launch = true

# 디렉토리도 인덱스에 포함
# index_directories = true

# 드라이브 자동 스캔 (C:\, D:\ 등)
# scan_drives = false
# drive_scan_depth = 2

# 검색할 디렉토리 (기본: Desktop, Documents, Downloads)
# search_paths = ["C:\\Users\\사용자\\Documents", "D:\\Projects"]

# ── 검색 우선순위 가중치 (0-100, 높을수록 상위) ──────────────
[launcher.kind_weights]
# directory = 80
# app = 70
# file = 50
# executable = 40
# system_cmd = 30
# web_search = 20

# ── 키 바인딩 ────────────────────────────────────────────────
[keybindings]
# kmd-desktop 실행 글로벌 핫키 (데몬 모드에서 동작)
# vim-nav 레이어와 독립적으로 항상 등록됨
# 형식: "수정자+키" (예: "alt+space", "ctrl+space", "cmd+j")
# global_hotkey = "alt+space"

# TUI 키 바인딩
# quit = "ctrl+c"
# next = "down"
# prev = "up"
# select = "enter"
# toggle_preview = "ctrl+p"

# ── 데몬 자동 시작 ───────────────────────────────────────────
# kmd-daemon install   → 부팅 시 자동 시작 등록
# kmd-daemon uninstall → 자동 시작 해제
# kmd-daemon status    → 현재 상태 및 자동 시작 등록 여부 확인
#
# Windows: Startup 폴더에 VBS 스크립트 생성 (콘솔 창 없이 실행)
# macOS:   ~/Library/LaunchAgents/com.keymander.daemon.plist
# Linux:   ~/.config/systemd/user/kmd-daemon.service

# ── 키맵 설정 (데몬 연동) ────────────────────────────────────
[launcher.keymap]
# 프리셋: "vim-nav" (기본) | "minimal" | "none"
# "vim-nav"이면 아래 설정이 기본값으로 적용되며, 수정하면 그 값이 우선
active_profile = "vim-nav"

# ── vim-nav 레이어: Alt(Option) 홀드 → Vim 네비게이션 ──
[launcher.keymap.layers.nav]
trigger = "LAlt"
tap_action = "Escape"              # 짧게 탭하면 Escape
tap_hold_ms = 200

[launcher.keymap.layers.nav.mappings]
H = "Left"                         # Alt+H → 왼쪽
J = "Down"                         # Alt+J → 아래
K = "Up"                           # Alt+K → 위
L = "Right"                        # Alt+L → 오른쪽
N = "PageUp"                       # Alt+N → 페이지 업
M = "PageDown"                     # Alt+M → 페이지 다운
"." = "Backspace"                   # Alt+. → 백스페이스
"/" = "Delete"                      # Alt+/ → Delete
Space = "Shift+Space"                # Alt+Space → 한/영 전환 (Shift+Space 전달)
# ── macOS: Cmd 사용  |  Windows: "Ctrl+V", "macro:Home;Shift+End;Ctrl+C" ──
P = "Cmd+V"                         # Alt+P → 붙여넣기
Y = "macro:Ctrl+A;Shift+Ctrl+E;Cmd+C"  # Alt+Y → 줄 복사 (Ctrl+A/E = macOS 범용)

# ── 레이어 내 더블탭 ──
# macOS: Alt=단어이동, Cmd=줄시작/끝  |  Windows: Ctrl=단어이동, Home/End
[launcher.keymap.layers.nav.double_taps.I]
single = "Alt+Left"                 # Alt+I 한번 → 단어 왼쪽 이동
double = "Ctrl+A"                   # Alt+I 더블탭 → 줄 처음 (Cocoa+readline 범용)
timeout_ms = 300

[launcher.keymap.layers.nav.double_taps.O]
single = "Alt+Right"                # Alt+O 한번 → 단어 오른쪽 이동
double = "Ctrl+E"                   # Alt+O 더블탭 → 줄 끝 (Cocoa+readline 범용)
timeout_ms = 300

# ── 글로벌 콤보 (수정자+키) ──
# Shift+Space는 macOS 시스템 입력소스 전환으로 직접 처리됨 (데몬이 가로채지 않음)
# [[launcher.keymap.combos]]
# trigger = "Shift+Space"
# action = "Hangul"

# ── 글로벌 더블탭 ──
[[launcher.keymap.double_taps]]
key = "RShift"
action = "Hangul"                   # RShift 빠르게 두 번 → 한/영 전환
timeout_ms = 300

# ── 액션 문자열 형식 ──────────────────────────────────────
# "Home"              → 단일 키 전송
# "Ctrl+Left"         → 수정자+키 콤보 전송
# "Cmd+C"             → macOS Command+키 콤보
# "Ctrl+Shift+End"    → 복수 수정자+키 콤보
# "launch:kmd-desktop" → 프로그램 실행
# "macro:Home;Shift+End;Ctrl+C" → 여러 키 순차 실행 (;로 구분)
#
# 수정자: Ctrl, Shift, Alt, Cmd (= Win/Super/Meta)
# 키 이름: a-z, 0-9, f1-f12, Home, End, Left, Right, Up, Down,
#          PageUp, PageDown, Space, Enter, Escape, Tab, CapsLock,
#          Backspace, Delete, Insert, LAlt, RAlt, LCtrl, RCtrl,
#          LShift, RShift, LWin, Hangul, Hanja, Semicolon, Comma,
#          Period, Slash, Backslash, LBracket, RBracket, Minus, Equal
