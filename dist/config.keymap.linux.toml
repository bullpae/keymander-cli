# ── 키맵 설정 (Linux + 데몬) ─────────────────────────────────
#
# Linux에서는 내장 키 바인딩 엔진이 아직 스텁입니다.
# active_profile 만 두면 코드 내장 vim-nav 프리셋이 적용됩니다:
#   단어 이동 = Ctrl+Left/Right (Windows와 동일), 줄 끝 = Home/End, 붙여넣기 = Ctrl+V.
# 향후 evdev 지원 시 필요하면 config.keymap.windows.toml 을 참고해 조각을 복제·조정하세요.

[launcher.keymap]
active_profile = "vim-nav"
