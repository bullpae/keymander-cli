name: Publish Linux Repos

# APT/YUM 저장소를 GitHub Pages(gh-pages 브랜치)로 발행한다.
#
# 릴리스 자산으로 .deb/.rpm 을 올려두는 것만으로는 `apt update`/`dnf upgrade` 가
# 갱신을 찾지 못한다. 인덱스(Packages/repodata)와 서명이 있는 저장소가 필요하다.
#
# 릴리스 워크플로가 workflow_call 로 호출하며, 수동 실행(workflow_dispatch)으로
# 릴리스 없이 재발행/검증할 수도 있다.
#
# 필요한 시크릿: GPG_PRIVATE_KEY (armored 비밀키, 패스프레이즈 없음)

on:
  workflow_call:
  workflow_dispatch:

# Pages는 브랜치(gh-pages)가 아니라 Actions 아티팩트로 배포한다.
# 브랜치 방식은 릴리스마다 수십 MB의 패키지 바이너리를 git 객체로 밀어 넣고,
# 배포 실패가 저장소 Actions 밖(legacy pages builder)에서 나 진단이 어렵다.
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 두 발행이 겹치지 않게 한다. 취소하지 않고 줄을 세우는 이유는
# 저장소가 반쯤 갱신된 상태로 남는 걸 막기 위해서다.
concurrency:
  group: pages
  cancel-in-progress: false

# 최근 몇 개 안정 릴리스를 저장소에 담을지. 릴리스 하나가 deb+rpm 약 17MB 이고,
# Pages 배포 시간이 사이트 크기를 따라가므로(아래 deploy 스텝 주석 참고) 현재 버전과
# 직전 버전 두 개만 담는다 — `apt install keymander=<직전버전>` 롤백은 유지된다.
env:
  KEEP_RELEASES: "2"

jobs:
  publish:
    name: Build and publish apt/yum repos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing key
        id: key
        env:
          HAS_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "has=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Skip notice
        if: steps.key.outputs.has != 'true'
        run: |
          echo "::warning::GPG_PRIVATE_KEY 시크릿이 없어 저장소 발행을 건너뜁니다."

      - name: Install repo tooling
        if: steps.key.outputs.has == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils createrepo-c rpm gnupg

      - name: Import signing key
        if: steps.key.outputs.has == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "GPG_KEY_ID=$FPR" >> "$GITHUB_ENV"
          echo "서명 키: $FPR"

      - name: Collect packages from recent stable releases
        if: steps.key.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p staging
          # 프리릴리스(-rc 등)는 안정 저장소에 넣지 않는다.
          TAGS=$(gh release list --exclude-drafts --exclude-pre-releases \
                   --limit 50 --json tagName --jq '.[].tagName' \
                 | grep -v -- '-' | head -n "$KEEP_RELEASES")
          echo "대상 릴리스:"; echo "$TAGS"
          for tag in $TAGS; do
            # v0.9.3 이전 릴리스에는 deb/rpm 자산이 없다 — 없으면 조용히 넘어간다.
            gh release download "$tag" -D staging --clobber \
              --pattern '*.deb' --pattern '*.rpm' 2>/dev/null || true
          done
          ls -la staging

      - name: Build apt/yum trees
        if: steps.key.outputs.has == 'true'
        run: |
          mkdir -p site
          scripts/build-linux-repos.sh staging site
          # 발행 후 "정말 이번 빌드가 서빙되는지" 확인할 기준값.
          # 이게 없으면 배포가 조용히 실패해도 예전 저장소가 200을 돌려주므로
          # 스모크 테스트가 통과해 버린다.
          EXPECTED=$(awk '/^Version:/{print $2}' \
            site/apt/dists/stable/main/binary-amd64/Packages | sort -V | tail -1)
          echo "EXPECTED_VERSION=$EXPECTED" >> "$GITHUB_ENV"
          echo "이번 발행의 최신 버전: $EXPECTED"

      - name: Stage public key, .repo file and landing page
        if: steps.key.outputs.has == 'true'
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          # Jekyll 이 repodata/ 같은 디렉터리를 건드리지 않게 한다.
          touch site/.nojekyll

          cp dist/keymander-archive-keyring.asc site/
          gpg --dearmor < dist/keymander-archive-keyring.asc > site/keymander-archive-keyring.gpg

          cat > site/keymander.repo <<EOF
          [keymander]
          name=keymander
          baseurl=${BASE_URL}/yum/\$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=${BASE_URL}/keymander-archive-keyring.asc
          EOF

          # 안내 페이지 — 사용자가 URL 을 그냥 열었을 때 설치법이 보이게.
          cat > site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>keymander Linux package repositories</title>
          <style>
            body{font:16px/1.6 system-ui,sans-serif;max-width:52rem;margin:3rem auto;padding:0 1rem}
            pre{background:#f4f4f5;padding:1rem;border-radius:6px;overflow-x:auto}
            @media(prefers-color-scheme:dark){body{background:#18181b;color:#e4e4e7}pre{background:#27272a}}
          </style>
          <h1>keymander Linux package repositories</h1>
          <p>See <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a>.</p>
          <h2>Debian / Ubuntu (apt)</h2>
          <pre>sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL ${BASE_URL}/keymander-archive-keyring.asc \\
            | sudo gpg --dearmor -o /etc/apt/keyrings/keymander.gpg
          echo "deb [signed-by=/etc/apt/keyrings/keymander.gpg] ${BASE_URL}/apt stable main" \\
            | sudo tee /etc/apt/sources.list.d/keymander.list
          sudo apt update && sudo apt install keymander</pre>
          <h2>Fedora / RHEL / CentOS (dnf, yum)</h2>
          <pre>sudo rpm --import ${BASE_URL}/keymander-archive-keyring.asc
          sudo curl -fsSL -o /etc/yum.repos.d/keymander.repo ${BASE_URL}/keymander.repo
          sudo dnf install keymander</pre>
          EOF

      - name: Upload Pages artifact
        if: steps.key.outputs.has == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages 는 배포가 끝날 때까지 폴링하는데, 그 대기 한도가 10분으로
      # 막혀 있다(timeout 입력을 더 크게 줘도 600000ms 로 잘린다). 이 저장소는
      # 패키지 바이너리 때문에 그보다 오래 걸려 액션이 먼저 포기하지만, 배포
      # 자체는 뒤이어 성공한다. 그래서 이 스텝의 실패는 판단 근거로 쓰지 않고,
      # 바로 아래 스모크 테스트가 "실제로 서빙되는 내용"으로 성패를 가른다.
      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.key.outputs.has == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Smoke test the published repos
        if: steps.key.outputs.has == 'true'
        env:
          # deploy 스텝이 타임아웃하면 page_url 출력이 비므로 직접 만든다.
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          # 배포 완료 + CDN 반영까지 최대 15분 기다린다. 단순히 200이 오는지가
          # 아니라 **이번 빌드의 버전**이 인덱스에 있는지로 판정한다 — 배포가
          # 실패해 이전 저장소가 그대로 남아 있어도 200은 돌아오기 때문이다.
          for i in $(seq 1 30); do
            if curl -fsS "$URL/apt/dists/stable/main/binary-amd64/Packages" -o /tmp/Packages \
               && grep -q "^Version: $EXPECTED_VERSION$" /tmp/Packages; then
              echo "서빙 확인 (${i}회차): $EXPECTED_VERSION"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::15분 안에 $EXPECTED_VERSION 이 서빙되지 않았습니다."
              exit 1
            fi
            echo "대기 ${i}/30..."; sleep 30
          done

          curl -fsS "$URL/apt/dists/stable/InRelease" -o /tmp/InRelease
          gpg --verify /tmp/InRelease
          curl -fsS "$URL/yum/x86_64/repodata/repomd.xml" -o /tmp/repomd.xml
          curl -fsS "$URL/yum/x86_64/repodata/repomd.xml.asc" -o /tmp/repomd.xml.asc
          gpg --verify /tmp/repomd.xml.asc /tmp/repomd.xml
          echo "✓ apt/yum 저장소 서명 검증 통과: $URL"
