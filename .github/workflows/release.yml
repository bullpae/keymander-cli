name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kmd
            prefix: kmd
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kmd
            prefix: kmd
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kmd
            prefix: kmd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kmd.exe
            prefix: kmd
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: kmd.exe
            prefix: kmd

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Validate
        run: cargo check --workspace

      - name: Build
        run: cargo build --release -p keymander --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.prefix }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.prefix }}-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}-${{ matrix.target }}
          path: ${{ matrix.prefix }}-${{ matrix.target }}.*

  build-desktop:
    name: Build Desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kmd-desktop
            prefix: kmd-desktop
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kmd-desktop
            prefix: kmd-desktop
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kmd-desktop
            prefix: kmd-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kmd-desktop.exe
            prefix: kmd-desktop
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: kmd-desktop.exe
            prefix: kmd-desktop

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps (iced/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev

      - name: Validate
        run: cargo check --workspace

      - name: Build
        run: cargo build --release -p kmd-desktop --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.prefix }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.prefix }}-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}-${{ matrix.target }}
          path: ${{ matrix.prefix }}-${{ matrix.target }}.*

  build-bundle:
    name: Portable Bundle ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps (iced/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev

      - name: Build all binaries
        run: |
          cargo build --release -p keymander --target ${{ matrix.target }}
          cargo build --release -p kmd-desktop --target ${{ matrix.target }}
          cargo build --release -p kmd-daemon --target ${{ matrix.target }}

      - name: Stage portable bundle
        shell: bash
        run: |
          STAGE="keymander"
          mkdir -p "$STAGE/kmd-data"
          cp "target/${{ matrix.target }}/release/kmd${{ matrix.ext }}" "$STAGE/"
          cp "target/${{ matrix.target }}/release/kmd-desktop${{ matrix.ext }}" "$STAGE/"
          cp "target/${{ matrix.target }}/release/kmd-daemon${{ matrix.ext }}" "$STAGE/"
          case "${{ matrix.target }}" in
            *windows*) KEYMAP=windows ;;
            *apple-darwin*) KEYMAP=macos ;;
            *) KEYMAP=linux ;;
          esac
          cat dist/config.shared.toml "dist/config.keymap.${KEYMAP}.toml" > "$STAGE/kmd-data/config.toml"
          cp dist/README.txt "$STAGE/"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf keymander-portable-${{ matrix.target }}.tar.gz keymander

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: 7z a keymander-portable-${{ matrix.target }}.zip keymander

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keymander-portable-${{ matrix.target }}
          path: keymander-portable-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: [build-cli, build-desktop, build-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum */* | awk '{n=split($2,p,"/"); print $1 "  " p[n]}' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # 릴리스마다 bullpae/homebrew-tap의 formula를 자동 갱신한다.
  # TAP_GITHUB_TOKEN(homebrew-tap 저장소 쓰기 권한 PAT) 시크릿이 없으면 건너뛴다.
  update-tap:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        id: tap
        env:
          HAS_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
        run: echo "has=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.tap.outputs.has == 'true'

      - uses: actions/download-artifact@v4
        if: steps.tap.outputs.has == 'true'
        with:
          path: artifacts

      - name: Generate and push formula
        if: steps.tap.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "artifacts/$1/$1.tar.gz" | cut -d' ' -f1; }
          scripts/gen-homebrew-formula.sh "$VERSION" \
            "$(sha keymander-portable-aarch64-apple-darwin)" \
            "$(sha keymander-portable-x86_64-apple-darwin)" \
            "$(sha keymander-portable-x86_64-unknown-linux-gnu)" \
            > keymander.rb

          git clone "https://x-access-token:${GH_TOKEN}@github.com/bullpae/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp keymander.rb tap/Formula/keymander.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keymander.rb
          git diff --cached --quiet && exit 0
          git commit -m "keymander ${VERSION}"
          git push
